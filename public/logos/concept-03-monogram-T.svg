<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="TANHOWA - Monogram T concept">
  <title>Concept 3 — Monogram T</title>
  <defs>
    <linearGradient id="c3ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="c3T" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="c3leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
  </defs>

  <g transform="translate(200,200)">
    <!-- Outer ring -->
    <circle r="115" fill="url(#c3ring)"/>
    <circle r="105" fill="#fefce8"/>
    <circle r="105" fill="none" stroke="url(#c3T)" stroke-width="1.5"/>
    <circle r="98" fill="none" stroke="#a16207" stroke-width="0.5" stroke-dasharray="1 4"/>

    <!-- Bold T monogram -->
    <g>
      <!-- Crossbar -->
      <rect x="-58" y="-50" width="116" height="22" rx="3" fill="url(#c3T)"/>
      <!-- Stem -->
      <rect x="-13" y="-50" width="26" height="100" rx="3" fill="url(#c3T)"/>
    </g>

    <!-- Leaf flourish on top right of T -->
    <path d="M 35,-50 C 42,-72 62,-82 78,-78 C 70,-62 55,-52 38,-48 Z" fill="url(#c3leaf)"/>
    <path d="M 38,-48 Q 55,-62 72,-72" stroke="#fefce8" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- Small leaf on top left for balance -->
    <path d="M -35,-50 C -42,-68 -56,-74 -68,-70 C -62,-58 -50,-52 -38,-48 Z" fill="url(#c3leaf)" opacity="0.85"/>

    <!-- Sun/seed dot at base of T -->
    <circle cx="0" cy="62" r="6" fill="url(#c3T)"/>
    <circle cx="0" cy="62" r="6" fill="none" stroke="#a16207" stroke-width="0.5"/>
  </g>

  <text x="200" y="385" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#14532d" text-anchor="middle" letter-spacing="5">TANHOWA</text>
  <line x1="135" y1="402" x2="265" y2="402" stroke="#a16207" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="426" font-family="Inter, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#3f6212" text-anchor="middle" letter-spacing="3">HORTICULTURAL OFFICERS WELFARE ASSOCIATION</text>
</svg>
