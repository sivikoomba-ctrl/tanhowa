<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="TANHOWA - Sprout T concept">
  <title>Concept 1 — Sprout T</title>
  <defs>
    <linearGradient id="c1leafA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="c1leafB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="c1trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <g transform="translate(200,210)">
    <!-- Trunk -->
    <rect x="-9" y="-5" width="18" height="115" rx="9" fill="url(#c1trunk)"/>
    <!-- Right arm leaf -->
    <path d="M 0,-5 C 28,-22 65,-50 100,-95 C 78,-45 42,-15 5,5 Z" fill="url(#c1leafA)"/>
    <!-- Left arm leaf -->
    <path d="M 0,-5 C -28,-22 -65,-50 -100,-95 C -78,-45 -42,-15 -5,5 Z" fill="url(#c1leafB)"/>
    <!-- Subtle leaf vein -->
    <path d="M 0,-5 Q 30,-30 65,-65" stroke="#fefce8" stroke-width="1" fill="none" opacity="0.35"/>
    <path d="M 0,-5 Q -30,-30 -65,-65" stroke="#fefce8" stroke-width="1" fill="none" opacity="0.35"/>
    <!-- Brass bud -->
    <circle cx="0" cy="-103" r="9" fill="#ca8a04"/>
    <circle cx="0" cy="-103" r="9" fill="none" stroke="#a16207" stroke-width="0.8"/>
    <!-- Soil base -->
    <ellipse cx="0" cy="115" rx="48" ry="4.5" fill="#1c1917" opacity="0.45"/>
  </g>

  <text x="200" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#14532d" text-anchor="middle" letter-spacing="6">TANHOWA</text>
  <line x1="135" y1="412" x2="265" y2="412" stroke="#a16207" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="436" font-family="Inter, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#3f6212" text-anchor="middle" letter-spacing="3">HORTICULTURAL OFFICERS WELFARE ASSOCIATION</text>
</svg>
