<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="TANHOWA - Laurel Wreath concept">
  <title>Concept 4 — Laurel Wreath</title>
  <defs>
    <linearGradient id="c4leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="c4leafSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="c4gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <g transform="translate(200,200)">
    <!-- Subtle background circle (cream) -->
    <circle r="118" fill="#fefce8"/>
    <circle r="118" fill="none" stroke="#a16207" stroke-width="0.8" stroke-dasharray="1 4"/>

    <!-- Left laurel branch (curving up & in) -->
    <g>
      <!-- Branch stem -->
      <path d="M -60,90 Q -100,30 -85,-60" stroke="#3f6212" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Leaves on left branch -->
      <ellipse cx="-95" cy="-40" rx="14" ry="6" fill="url(#c4leaf)" transform="rotate(-25 -95 -40)"/>
      <ellipse cx="-100" cy="-15" rx="14" ry="6" fill="url(#c4leafSoft)" transform="rotate(-15 -100 -15)"/>
      <ellipse cx="-100" cy="10" rx="14" ry="6" fill="url(#c4leaf)" transform="rotate(0 -100 10)"/>
      <ellipse cx="-95" cy="35" rx="14" ry="6" fill="url(#c4leafSoft)" transform="rotate(15 -95 35)"/>
      <ellipse cx="-85" cy="58" rx="13" ry="6" fill="url(#c4leaf)" transform="rotate(30 -85 58)"/>
      <ellipse cx="-72" cy="78" rx="12" ry="5.5" fill="url(#c4leafSoft)" transform="rotate(45 -72 78)"/>
      <!-- Inner side leaves (smaller, lighter) -->
      <ellipse cx="-78" cy="-30" rx="10" ry="4.5" fill="url(#c4leafSoft)" transform="rotate(-50 -78 -30)" opacity="0.85"/>
      <ellipse cx="-82" cy="-5" rx="10" ry="4.5" fill="url(#c4leaf)" transform="rotate(-35 -82 -5)" opacity="0.85"/>
      <ellipse cx="-82" cy="20" rx="10" ry="4.5" fill="url(#c4leafSoft)" transform="rotate(-15 -82 20)" opacity="0.85"/>
      <ellipse cx="-78" cy="45" rx="10" ry="4.5" fill="url(#c4leaf)" transform="rotate(10 -78 45)" opacity="0.85"/>
    </g>

    <!-- Right laurel branch (mirror) -->
    <g>
      <path d="M 60,90 Q 100,30 85,-60" stroke="#3f6212" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="95" cy="-40" rx="14" ry="6" fill="url(#c4leaf)" transform="rotate(25 95 -40)"/>
      <ellipse cx="100" cy="-15" rx="14" ry="6" fill="url(#c4leafSoft)" transform="rotate(15 100 -15)"/>
      <ellipse cx="100" cy="10" rx="14" ry="6" fill="url(#c4leaf)" transform="rotate(0 100 10)"/>
      <ellipse cx="95" cy="35" rx="14" ry="6" fill="url(#c4leafSoft)" transform="rotate(-15 95 35)"/>
      <ellipse cx="85" cy="58" rx="13" ry="6" fill="url(#c4leaf)" transform="rotate(-30 85 58)"/>
      <ellipse cx="72" cy="78" rx="12" ry="5.5" fill="url(#c4leafSoft)" transform="rotate(-45 72 78)"/>
      <ellipse cx="78" cy="-30" rx="10" ry="4.5" fill="url(#c4leafSoft)" transform="rotate(50 78 -30)" opacity="0.85"/>
      <ellipse cx="82" cy="-5" rx="10" ry="4.5" fill="url(#c4leaf)" transform="rotate(35 82 -5)" opacity="0.85"/>
      <ellipse cx="82" cy="20" rx="10" ry="4.5" fill="url(#c4leafSoft)" transform="rotate(15 82 20)" opacity="0.85"/>
      <ellipse cx="78" cy="45" rx="10" ry="4.5" fill="url(#c4leaf)" transform="rotate(-10 78 45)" opacity="0.85"/>
    </g>

    <!-- Top crowning star -->
    <g transform="translate(0,-72)">
      <polygon points="0,-12 3,-4 12,-4 5,2 8,11 0,6 -8,11 -5,2 -12,-4 -3,-4" fill="url(#c4gold)" stroke="#a16207" stroke-width="0.6"/>
    </g>

    <!-- Center monogram T -->
    <g>
      <rect x="-32" y="-30" width="64" height="14" rx="2" fill="#14532d"/>
      <rect x="-7" y="-30" width="14" height="62" rx="2" fill="#14532d"/>
    </g>

    <!-- Bottom crossing knot/ribbon -->
    <path d="M -55,90 Q 0,108 55,90 Q 35,98 0,98 Q -35,98 -55,90 Z" fill="url(#c4gold)" stroke="#a16207" stroke-width="0.8"/>
  </g>

  <text x="200" y="385" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#14532d" text-anchor="middle" letter-spacing="5">TANHOWA</text>
  <line x1="135" y1="402" x2="265" y2="402" stroke="#a16207" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="426" font-family="Inter, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#3f6212" text-anchor="middle" letter-spacing="3">HORTICULTURAL OFFICERS WELFARE ASSOCIATION</text>
</svg>
