<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="TANHOWA - Heraldic Shield concept">
  <title>Concept 2 — Heraldic Shield</title>
  <defs>
    <linearGradient id="c2shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="c2leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="60%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="c2gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <g transform="translate(200,200)">
    <!-- Shield silhouette: pointed at bottom, flat-arched at top -->
    <path d="M -90,-100 L 90,-100 Q 95,-90 95,-30 Q 95,40 60,80 Q 25,118 0,128 Q -25,118 -60,80 Q -95,40 -95,-30 Q -95,-90 -90,-100 Z"
          fill="url(#c2shield)" stroke="#a16207" stroke-width="3"/>
    <!-- Inner border -->
    <path d="M -82,-92 L 82,-92 Q 86,-84 86,-30 Q 86,36 56,72 Q 24,108 0,118 Q -24,108 -56,72 Q -86,36 -86,-30 Q -86,-84 -82,-92 Z"
          fill="none" stroke="url(#c2gold)" stroke-width="1.2"/>

    <!-- Top banner with TANHOWA -->
    <rect x="-65" y="-78" width="130" height="22" rx="2" fill="url(#c2gold)"/>
    <text x="0" y="-62" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle" letter-spacing="4">TANHOWA</text>

    <!-- Central leaf -->
    <path d="M 0,55 C -38,30 -50,-25 0,-50 C 50,-25 38,30 0,55 Z" fill="url(#c2leaf)"/>
    <!-- Vein -->
    <line x1="0" y1="55" x2="0" y2="-50" stroke="#fefce8" stroke-width="1.5" opacity="0.7"/>
    <path d="M 0,30 Q -16,18 -28,8" stroke="#fefce8" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M 0,30 Q 16,18 28,8" stroke="#fefce8" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M 0,5 Q -18,-8 -32,-22" stroke="#fefce8" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M 0,5 Q 18,-8 32,-22" stroke="#fefce8" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- Star/dot accents -->
    <circle cx="-55" cy="0" r="2.5" fill="url(#c2gold)"/>
    <circle cx="55" cy="0" r="2.5" fill="url(#c2gold)"/>
  </g>

  <text x="200" y="385" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#14532d" text-anchor="middle" letter-spacing="5">TANHOWA</text>
  <line x1="135" y1="402" x2="265" y2="402" stroke="#a16207" stroke-width="1.5" stroke-linecap="round"/>
  <text x="200" y="426" font-family="Inter, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#3f6212" text-anchor="middle" letter-spacing="3">HORTICULTURAL OFFICERS WELFARE ASSOCIATION</text>
</svg>
